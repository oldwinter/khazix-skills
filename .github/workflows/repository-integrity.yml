name: Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: python3 -m unittest discover -s . -p 'test*.py' -v
      - name: Validate repository contracts
        run: python3 scripts/validate_repository.py
      - name: Compile Python sources
        run: python3 -m compileall -q aihot hv-analysis neat-freak storage-analyzer scripts tests
      - name: Check shell syntax
        run: bash -n aihot/install.sh neat-freak/scripts/audit-inventory.sh
